name: Rasd regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run typecheck
      - name: Lint full repository
        run: bun run lint
      - name: Audit production dependencies
        run: bun run audit:prod
      - run: bun run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start database-only Supabase CI stack
        # Mailpit uses 54324 and is irrelevant to rollback-only SQL checks.
        # Exclude optional containers to avoid port collisions and save RAM.
        run: supabase start --exclude mailpit,studio,imgproxy,logflare,vector
      - name: Rebuild schema from checked-in migrations
        run: supabase db reset --local
      - name: Run rollback-only database regressions
        env:
          RASD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/run-db-regression.mjs
      - name: Stop disposable local Supabase services
        if: always()
        run: supabase stop --no-backup || true

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
