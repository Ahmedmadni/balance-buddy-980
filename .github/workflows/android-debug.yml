name: Android hosted debug package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_ENV: production
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Check public application configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SUPABASE_PROJECT_ID"
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run build
      - name: Prepare hosted-app bootstrap for Capacitor
        run: |
          mkdir -p dist/client
          printf '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رصد</title></head><body>رصد</body></html>' > dist/client/index.html
      - name: Generate Android project when absent
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
      - run: bun run android:assets
      - run: bunx cap sync android
      - name: Build test APK only
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/*.apk > android-debug-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rasd-hosted-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14