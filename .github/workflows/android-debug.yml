name: Android hosted debug package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CAP_ENV: production
      CAP_SERVER_URL: https://balance-buddy-980.lovable.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check hosted application availability
        run: |
          curl --fail --silent --show-error --location --output /dev/null "$CAP_SERVER_URL/auth"
      - name: Install locked dependencies with Sharp fallback
        run: bash scripts/ci-install-with-sharp-fallback.sh
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run audit:prod
      - name: Prepare hosted-app bootstrap for Capacitor
        run: |
          mkdir -p dist/client
          printf '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رصد</title></head><body>رصد</body></html>' > dist/client/index.html
      - name: Generate Android project when absent
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
      - run: bun run android:assets
      - name: Install native OAuth callback, privacy and report printing bridges
        run: node scripts/ensure-android.mjs
      - run: bunx cap sync android
      - name: Validate registered native Android features
        run: |
          grep -q 'android:scheme="app.lovable.rasd"' android/app/src/main/AndroidManifest.xml
          grep -q 'FLAG_SECURE' android/app/src/main/java/app/lovable/rasd/MainActivity.java
          grep -q 'registerPlugin(RasdPrintPlugin.class)' android/app/src/main/java/app/lovable/rasd/MainActivity.java
          grep -q 'PrintManager' android/app/src/main/java/app/lovable/rasd/RasdPrintPlugin.java
      - name: Build test APK only
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/debug/*.apk > android-debug-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rasd-hosted-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android-debug-sha256.txt
          if-no-files-found: error
          retention-days: 14