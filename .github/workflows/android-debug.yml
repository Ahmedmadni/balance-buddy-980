name: Rasd Android debug APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build web client and create mandatory Capacitor entrypoint
        run: bun run android:prepare
      - name: Generate Android platform and sync hosted production configuration
        env:
          CAP_ENV: production
        run: |
          bunx cap add android
          bunx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rasd-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
