name: Rasd Android emulator launch smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run android:prepare
      - name: Build test APK
        env:
          CAP_ENV: production
        run: |
          bunx cap add android
          bunx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Rasd on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/smoke-android-emulator.sh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save anonymous emulator screenshot and device diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasd-android-emulator-smoke
          path: android-smoke-output/
          if-no-files-found: ignore
          retention-days: 7
