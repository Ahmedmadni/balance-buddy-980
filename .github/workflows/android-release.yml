name: Android signed release (APK + AAB)

# Manual only. Builds signed release files and uploads them as private
# workflow artifacts. Never publishes to Google Play.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (integer, must increase every release)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAP_ENV: production
      CAP_SERVER_URL: https://balance-buddy-980.lovable.app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify signing secrets are configured
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for n in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "::error::Missing signing secret ($n)"; missing=1; fi
          done
          [ "$missing" = 0 ]
          case "${{ inputs.version_code }}" in (*[!0-9]*|'') echo "::error::version_code must be an integer"; exit 1;; esac

      - name: Check hosted application availability
        run: curl --fail --silent --show-error --location --output /dev/null "$CAP_SERVER_URL/auth"
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run audit:prod

      - name: Prepare hosted-app bootstrap for Capacitor
        run: |
          mkdir -p dist/client
          printf '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رصد</title></head><body>رصد</body></html>' > dist/client/index.html
      - name: Generate Android project when absent
        run: if [ ! -d android ]; then bunx cap add android; fi
      - run: bun run android:assets
      - run: bunx cap sync android

      - name: Set version
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ inputs.version_code }}/" "$f"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ inputs.version_name }}\"/" "$f"
          grep -E "versionCode|versionName" "$f"

      - name: Restore keystore (temporary, runner only)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -v -i "password"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Record checksums
        run: |
          sha256sum android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab > android-release-sha256.txt
          cat android-release-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rasd-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
