name: Android signed release (APK + AAB)

# Manual only. Builds signed release files and uploads them as private
# workflow artifacts. Never publishes to Google Play.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (integer, must increase every release)"
        required: true
        default: "1"
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CAP_ENV: production
      CAP_SERVER_URL: https://balance-buddy-980.lovable.app
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      RELEASE_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify signing secrets are configured
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for n in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!n}" ]; then echo "::error::Missing signing secret ($n)"; missing=1; fi
          done
          [ "$missing" = 0 ]
          [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && [ "$RELEASE_VERSION_CODE" -le 2100000000 ] || { echo "::error::version_code must be between 1 and 2100000000"; exit 1; }
          [[ "$RELEASE_VERSION_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]] || { echo "::error::version_name must be 1-64 safe version characters"; exit 1; }

      - name: Check hosted application availability
        run: curl --fail --silent --show-error --location --output /dev/null "$CAP_SERVER_URL/auth"
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run audit:prod

      - name: Prepare hosted-app bootstrap for Capacitor
        run: |
          mkdir -p dist/client
          printf '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>رصد</title></head><body>رصد</body></html>' > dist/client/index.html
      - name: Generate Android project when absent
        run: if [ ! -d android ]; then bunx cap add android; fi
      - run: bun run android:assets
      - run: bunx cap sync android

      - name: Set version
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $RELEASE_VERSION_CODE/" "$f"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$RELEASE_VERSION_NAME\"/" "$f"
          grep -E "versionCode|versionName" "$f"

      - name: Restore keystore (temporary, runner only)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify APK signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -v -i "password"

      - name: Verify AAB signature and matching signing certificate
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          apk=android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify "$aab" > "$RUNNER_TEMP/aab-verification.txt" 2>&1
          grep -q 'jar verified\.' "$RUNNER_TEMP/aab-verification.txt" || { echo "::error::AAB signature verification failed"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk_cert=$("$BT/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          aab_cert=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test -n "$apk_cert" && test "$apk_cert" = "$aab_cert" || { echo "::error::APK and AAB signing certificates do not match"; exit 1; }

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Record checksums
        run: |
          sha256sum android/app/build/outputs/apk/release/*.apk android/app/build/outputs/bundle/release/*.aab > android-release-sha256.txt
          cat android-release-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rasd-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
