name: Rasd signed Android AAB (manual only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Monotonically increasing integer Play Store versionCode'
        required: true
        type: string
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: android-internal-testing
    env:
      CAP_ENV: production
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set signing path in the ephemeral runner
        run: echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/rasd-release.jks" >> "$GITHUB_ENV"
      - name: Verify signing prerequisites before building
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
          node scripts/configure-android-release.mjs --self-test
      - run: bun install --frozen-lockfile
      - run: bun run android:prepare
      - name: Generate native project
        run: |
          bunx cap add android
          bunx cap sync android
          node scripts/harden-native-manifest.mjs
          node scripts/register-native-document-save.mjs
      - name: Install private keystore into ephemeral runner directory
        shell: bash
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"
      - name: Configure Gradle release signing
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: node scripts/configure-android-release.mjs "$VERSION_CODE" "$VERSION_NAME"
      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Verify bundle signature
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed internal-testing bundle (not to Play automatically)
        uses: actions/upload-artifact@v4
        with:
          name: rasd-signed-internal-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup private signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_FILE"
