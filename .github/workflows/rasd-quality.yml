name: Rasd web and Android source quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bun run typecheck
      - name: Unit regression tests
        run: bun run test:unit
      - name: Android setup script syntax
        run: node --check scripts/ensure-android.mjs

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Android debug APK against published app
        run: bun run android:debug
      - name: Verify the OAuth callback is in AndroidManifest.xml
        run: grep -q 'android:scheme="app.lovable.rasd"' android/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: rasd-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
