name: Security one-time lockfile refresh (pinned TanStack release)
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/tanstack-xss-hotfix-20261016'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/tanstack-xss-hotfix-20261016
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate and audit fixed TanStack 2026-09-30 release
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
      - name: Commit updated locks
        run: |
          if git diff --quiet -- bun.lock package-lock.json; then exit 0; fi
          git add -- bun.lock package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(security): lock consistent TanStack patched release'
          git push origin HEAD:refs/heads/security/tanstack-xss-hotfix-20261016
