name: Security lockfile refresh (temporary)
on:
  pull_request:

permissions:
  contents: read

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rasd/android-offline-fonts-20261015'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rasd/android-offline-fonts-20261015
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate lockfiles with pinned patched transitive versions
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          bun install --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
      - name: Commit only changed lockfiles to feature branch
        run: |
          if git diff --quiet -- bun.lock package-lock.json; then
            echo 'Both lockfiles already current'
            exit 0
          fi
          git add -- bun.lock package-lock.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(security): refresh lockfiles for DOMPurify and source-map-js patches'
          git push origin HEAD:refs/heads/rasd/android-offline-fonts-20261015
